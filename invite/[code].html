<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BeatTogether — синхронизируй сердца</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .heart { font-size: 72px; margin-bottom: 24px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.12); }
    }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
    .sub { color: #888; font-size: 15px; line-height: 1.5; margin-bottom: 36px; }
    .btn {
      display: block;
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .btn-appstore { background: #e5001a; color: #fff; }
    .btn-open     { background: rgba(255,255,255,0.08); color: #fff;
                    border: 1px solid rgba(255,255,255,0.12); }
    .note { color: #555; font-size: 12px; margin-top: 24px; }
  </style>
  <script>
    // Extract invite code from path: /invite/CODE
    var parts = window.location.pathname.split('/');
    var code  = parts[parts.length - 1] || '';

    // Try to open the app via custom scheme; fall back to App Store after 1.5s
    function tryOpenApp() {
      if (!code) return;
      var appLink = 'beattogether://invite/' + code;
      window.location.href = appLink;
    }
  </script>
</head>
<body>
  <div class="card">
    <div class="heart">❤️</div>
    <h1>Тебя приглашают!</h1>
    <p class="sub">
      Установи BeatTogether и синхронизируй<br>
      своё сердце с близким человеком.
    </p>

    <!-- App Store link — замени на реальный после публикации -->
    <a class="btn btn-appstore"
       href="https://apps.apple.com/app/id6760045267"
       id="appstore-btn">
      📲 Скачать BeatTogether
    </a>

    <a class="btn btn-open" href="#" id="open-btn" style="display:none">
      Уже установлено? Открыть приложение
    </a>

    <p class="note">
      После установки ссылка откроется автоматически.
    </p>
  </div>

  <script>
    // Show "open app" button only on iOS
    var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    if (isIOS && code) {
      var openBtn = document.getElementById('open-btn');
      openBtn.style.display = 'block';
      openBtn.href = 'beattogether://invite/' + code;
    }

    // On iOS, if app is installed Universal Link opens it before page loads.
    // This page is only seen when app is NOT installed.
  </script>
</body>
</html>
